<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Starlight Keys">
<meta name="theme-color" content="#140f33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Starlight Keys</title>
<style>
  :root {
    --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ink: #fff;
    --panel: rgba(28, 18, 66, 0.92);
    --accent: #ff6fb5;
    --accent2: #7b6cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #140f33; color: var(--ink);
    font-family: var(--font); user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  [hidden] { display: none !important; }
  #safe { position: fixed; top: 0; left: 0; width: 0; height: 0; padding-top: env(safe-area-inset-top, 0px); visibility: hidden; pointer-events: none; }

  /* Menu */
  #menu {
    position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    touch-action: pan-y;
    padding: calc(env(safe-area-inset-top, 0px) + 28px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 32px) max(20px, env(safe-area-inset-left, 0px));
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 18px; }
  h1 { margin: 0; font-size: clamp(40px, 7vw, 72px); letter-spacing: 0.5px; line-height: 1.05;
       text-shadow: 0 4px 24px rgba(255, 111, 181, 0.45); }
  h1 span { color: #ffd65a; }
  .tag { margin: 8px 0 0; opacity: 0.85; font-size: clamp(16px, 2.2vw, 20px); }
  .settings { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 18px 0 6px; }
  .seg { display: flex; background: rgba(255,255,255,0.08); border-radius: 999px; padding: 5px; gap: 4px; }
  .seg button { border: 0; background: transparent; padding: 12px 20px; border-radius: 999px; font-size: 18px; font-weight: 700; opacity: 0.7; }
  .seg button.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); opacity: 1; box-shadow: 0 4px 14px rgba(123,108,255,0.4); }
  .hint { text-align: center; margin: 6px 0 22px; opacity: 0.8; font-size: 16px; min-height: 1.3em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
  .song {
    display: flex; align-items: center; gap: 14px; text-align: left; border: 0; border-radius: 22px; padding: 16px 18px;
    background: linear-gradient(135deg, hsla(var(--h), 85%, 62%, 0.30), hsla(calc(var(--h) + 40), 80%, 50%, 0.18));
    border: 2px solid hsla(var(--h), 90%, 70%, 0.45);
    transition: transform 0.12s;
    position: relative; overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -10px 24px rgba(0,0,0,0.18), 0 12px 28px rgba(0,0,0,0.35);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .song::before { /* glassy shine */
    content: ''; position: absolute; inset: 0 0 55% 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0));
  }
  .song::after {
    content: ''; position: absolute; top: -40%; left: 18%; width: 16%; height: 180%; transform: rotate(28deg); pointer-events: none;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.12), rgba(255,255,255,0));
  }
  .song:active { transform: scale(0.97); }
  .song .em { font-size: 40px; width: 54px; text-align: center; flex: none; }
  .song .info { flex: 1; min-width: 0; }
  .song .name { font-size: 19px; font-weight: 800; line-height: 1.2; }
  .song .meta { margin-top: 5px; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; opacity: 0.9; }
  .stars { color: #ffd65a; letter-spacing: 2px; }
  .stars .off { color: rgba(255,255,255,0.25); }

  /* In-game */
  #pauseBtn {
    position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 14px); left: calc(env(safe-area-inset-left, 0px) + 14px);
    width: 56px; height: 56px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.14);
    font-size: 22px; font-weight: 900; letter-spacing: 1px;
  }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
             background: rgba(8, 5, 25, 0.55); padding: 20px; }
  .panel { background: var(--panel); border-radius: 30px; padding: 30px 28px; width: min(440px, 100%); text-align: center;
           box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.12); animation: pop 0.28s ease-out; }
  @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .panel h2 { margin: 0 0 6px; font-size: 38px; }
  .panel .sub { opacity: 0.8; font-size: 18px; margin-bottom: 8px; }
  .bigstars { font-size: 58px; letter-spacing: 6px; margin: 6px 0; color: #ffd65a; }
  .bigstars .off { color: rgba(255,255,255,0.2); }
  .bigstars span { display: inline-block; animation: starIn 0.4s ease-out both; }
  .bigstars span:nth-child(2) { animation-delay: 0.15s; }
  .bigstars span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes starIn { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }
  .score { font-size: 22px; font-weight: 700; margin-bottom: 20px; }
  .btns { display: flex; flex-direction: column; gap: 12px; }
  .btn { border: 0; border-radius: 999px; padding: 18px; font-size: 22px; font-weight: 800; background: rgba(255,255,255,0.12); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 6px 20px rgba(255,111,181,0.35); }

  /* Apple Music */
  .section { margin: 30px 0 12px; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .amBtn { border: 0; border-radius: 999px; padding: 12px 20px; font-size: 18px; font-weight: 800;
           background: linear-gradient(135deg, #fa2d48, #a833d6); box-shadow: 0 4px 14px rgba(250,45,72,0.35); }
  .song img, .result img { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; flex: none; background: rgba(255,255,255,0.1); }
  .artist { font-size: 15px; opacity: 0.75; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #amScreen { position: fixed; inset: 0; z-index: 8; background: #140f33; display: flex; flex-direction: column;
              padding: calc(env(safe-area-inset-top, 0px) + 16px) max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); }
  #amScreen .top { display: flex; gap: 10px; align-items: center; max-width: 920px; width: 100%; margin: 0 auto; }
  #amScreen .back { border: 0; background: rgba(255,255,255,0.12); border-radius: 999px; padding: 12px 18px; font-size: 18px; font-weight: 800; flex: none; }
  #amSearch { flex: 1; min-width: 0; font: inherit; font-size: 20px; padding: 13px 18px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.2);
              background: rgba(255,255,255,0.08); color: #fff; outline: none; -webkit-user-select: text; user-select: text; }
  #amScreen .seg { align-self: center; margin: 14px 0 6px; }
  #amStatus { text-align: center; opacity: 0.85; margin: 10px 0; font-size: 17px; }
  #amResults { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y;
               max-width: 920px; width: 100%; margin: 0 auto; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); }
  .result { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 0; background: rgba(255,255,255,0.06);
            border-radius: 18px; padding: 10px 14px; margin-bottom: 8px; }
  .result .info { flex: 1; min-width: 0; }
  .result .name { font-size: 18px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tapBig { width: min(260px, 60vw); height: min(260px, 60vw); border-radius: 50%; border: 0; margin: 14px auto; display: block;
            font-size: 44px; font-weight: 900; background: radial-gradient(circle at 35% 30%, #ff9bd0, #ff6fb5 45%, #7b6cff); 
            box-shadow: 0 10px 40px rgba(255,111,181,0.45); transition: transform 0.06s; }
  .tapBig.pulse { transform: scale(0.93); }
  #calBpm { font-size: 20px; font-weight: 700; min-height: 1.4em; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>

<div id="menu">
  <div class="wrap">
    <header>
      <h1>Starlight <span>Keys</span></h1>
      <p class="tag">Tap the glowing tiles to play the song!</p>
    </header>
    <div class="settings">
      <div class="seg" id="modeSeg">
        <button data-v="relaxed">🐢 Relaxed</button>
        <button data-v="challenge">🐇 Challenge</button>
      </div>
      <div class="seg" id="speedSeg">
        <button data-v="0.75">Slow</button>
        <button data-v="1">Normal</button>
        <button data-v="1.3">Fast</button>
      </div>
    </div>
    <p class="hint" id="modeHint"></p>
    <div class="grid" id="songs"></div>
    <div id="amSection" hidden>
      <div class="section"><span>🎧 My Apple Music songs</span><button class="amBtn" id="amOpen">＋ Add a song</button></div>
      <div class="grid" id="amSongs"></div>
    </div>
  </div>
</div>

<div id="amScreen" hidden>
  <div class="top">
    <button class="back" id="amBack">‹ Back</button>
    <input id="amSearch" type="search" placeholder="Search for a song…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
  </div>
  <div class="seg" id="amWhere">
    <button data-v="library">My Library</button>
    <button data-v="catalog">All of Apple Music</button>
  </div>
  <div id="amStatus"></div>
  <div id="amResults"></div>
</div>

<div id="calib" class="overlay" hidden>
  <div class="panel">
    <h2>Find the beat</h2>
    <div class="sub" id="calSong"></div>
    <div class="sub" id="calHelp"></div>
    <button class="btn primary" id="calPlay">▶ Play the song</button>
    <button class="tapBig" id="calTap" hidden>TAP</button>
    <div id="calBpm"></div>
    <div class="btns" style="margin-top:14px">
      <button class="btn primary" id="calDone" hidden>Let's play!</button>
      <button class="btn" id="calCancel">Cancel</button>
    </div>
  </div>
</div>

<button id="pauseBtn" hidden aria-label="Pause">II</button>

<div id="pause" class="overlay" hidden>
  <div class="panel">
    <h2>Paused</h2>
    <div class="sub" id="pauseSong"></div>
    <div class="btns" style="margin-top:18px">
      <button class="btn primary" id="resumeBtn">Keep playing</button>
      <button class="btn" id="restartBtn">Start over</button>
      <button class="btn" id="retapBtn" hidden>Re-tap the beat</button>
      <button class="btn" id="quitBtn">Songs</button>
    </div>
  </div>
</div>

<div id="result" class="overlay" hidden>
  <div class="panel">
    <h2 id="resTitle"></h2>
    <div class="sub" id="resSong"></div>
    <div class="bigstars" id="resStars"></div>
    <div class="score" id="resScore"></div>
    <div class="btns">
      <button class="btn primary" id="againBtn">Play again</button>
      <button class="btn" id="menuBtn">Songs</button>
    </div>
  </div>
</div>

<script src="musickit-config.js"></script>
<script src="songs.js"></script>
<script src="music.js"></script>
<script src="charts.js"></script>
<script src="game.js"></script>
</body>
</html>
